[package]
name = "schicluster_rs"
version = "0.1.0"
edition = "2021"
description = "Rust port of scHiCluster's impute_chromosome inner pipeline."
license = "MIT"
authors = ["Zehua Zeng <starlitnightly@163.com>"]

[lib]
name = "_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"
ndarray = { version = "0.16", features = ["rayon"] }
sprs = "0.11"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
