name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          sccache: 'true'
      - name: Install wheel + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install --find-links dist schicluster-rs
          python -m pip install pytest scipy numpy
        shell: bash
      - name: Run tests
        # test_exact_match.py self-skips when rebuildpy isn't on PYTHONPATH
        # (CI runners don't check it out). test_parity.py runs in full.
        run: python -m pytest -v tests/
        shell: bash
