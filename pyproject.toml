[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "schicluster-rs"
version = "0.5.0"
description = "Rust port of scHiCluster's impute_chromosome inner pipeline — drop-in replacement for the published Python implementation. Bit-equivalent numerical behaviour, up to ~10× faster on long Hi-C chromosomes."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Zehua Zeng", email = "starlitnightly@163.com"},
]
keywords = ["single-cell", "Hi-C", "scHiCluster", "rust", "imputation"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    # The domain / contact_distance / loop / gene_score wrappers reassemble
    # upstream's DataFrame return shapes, so pandas is a genuine runtime
    # dependency of the public API — not just a dev/test one.
    # `cooler` stays optional (dev extra): only the cool-reading entry points
    # need it, they import it lazily, and it is a heavy dependency to force on
    # users who only call the in-memory kernels.
    "pandas>=1.1",
]

[project.scripts]
"schicluster-rs" = "schicluster_rs.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "schicluster>=1.3",  # for parity tests
    "pyyaml>=6",         # for tests/parity_harness.py manifest loader
    "cooler>=0.9",       # for fixture / driver scripts
    "h5py>=3",           # cooler dep but pinned explicitly
    "maturin>=1.4,<2",   # for `maturin develop --release`
]

[tool.maturin]
manifest-path = "rust/Cargo.toml"
features = ["pyo3/extension-module"]
module-name = "schicluster_rs._rust"
python-source = "python"
include = [
    { path = "LICENSE", format = ["sdist", "wheel"] },
]
